# Ego Harness layer. Override `steward-ego-runtime.config.endpoint` in the robot profile's
# cordis.patch.yml when the Ego API is not on the default port (one profile per robot).
- insert:
    - id: steward-ego-runtime
      name: '@steward/dsh-ego-runtime-client'
      config:
        endpoint: 'http://127.0.0.1:7420'
        timeoutMs: 15000
    - id: steward-tool-ego
      name: '@steward/dsh-tool-ego'
    - id: steward-robot-safety
      name: '@steward/dsh-robot-safety'
      config:
        maxRisk: 0.35

# Robot observations and motion use ctx.ego; optional synthesis tools return predictions.
# General computer tools could expose simulator World State or bypass Ego-State controls.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-web
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-working-directory
  disabled: true

# Retry interrupted model responses within the current step; completed tools stay committed.
- id: llm-deepseek
  config:
    retryPolicy:
      mode: normal
      maxRetries: 5
      retryableCodes:
        - EMPTY_RESPONSE
        - RATE_LIMIT
        - SERVER
        - TIMEOUT
        - TRANSPORT
        - STREAM_CLOSED
